# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Django REST Backend API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: bankease-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: bash ./build.sh
    startCommand: gunicorn bankease_config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Single-Page Application (Static Site)
  # ---------------------------------------------------------------------------
  - type: static
    name: bankease-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bankease-backend-6cl1.onrender.com/api/v1
