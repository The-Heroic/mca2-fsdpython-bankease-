# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Django REST Backend API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: bankease-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python seed_demo_data.py
    startCommand: cd backend && gunicorn bankease_config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Single-Page Application (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: bankease-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bankease-backend-6cl1.onrender.com/api/v1
